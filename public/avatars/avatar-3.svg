<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Fresh Green Gradient (Light Green to Mint) -->
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccff99" /> <!-- Light Green -->
      <stop offset="100%" stop-color="#99ffcc" /> <!-- Mint -->
    </linearGradient>
  </defs>
  
  <!-- Circular Avatar Background -->
  <circle cx="50" cy="50" r="50" fill="url(#leafGradient)" />
  
  <!-- Minimalist White Leaf Icon -->
  <g transform="translate(50 50)">
    <!-- Small Leaf Stem -->
    <rect x="-1" y="20" width="2" height="15" fill="#ffffff" rx="1" />
    
    <!-- Stylized Leaf Shape -->
    <path d="M0,20 C0,20 20,5 20,-15 A20,20 0 0 0 -20,-15 C -20,5 0,20 0,20 Z" fill="#ffffff" />
  </g>
</svg>
