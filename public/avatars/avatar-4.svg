<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Soft Purple Gradient: Lavender to Violet -->
    <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6E6FA" /> <!-- Lavender -->
      <stop offset="100%" stop-color="#8A2BE2" /> <!-- Violet -->
    </linearGradient>
  </defs>
  
  <!-- Circular Avatar Background -->
  <circle cx="50" cy="50" r="50" fill="url(#purpleGradient)" />
  
  <!-- Minimalist White Diamond Icon -->
  <polygon points="50,38 62,50 50,62 38,50" fill="#FFFFFF" />
</svg>
