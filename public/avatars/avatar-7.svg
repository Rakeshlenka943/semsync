<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define a linear gradient from dusty pink to rose, top to bottom -->
    <linearGradient id="gradientDustyRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6b0aa" />
      <stop offset="100%" stop-color="#cf8b90" />
    </linearGradient>
  </defs>
  
  <!-- The background circle, centered with radius 50 to fill the viewBox, using the gradient -->
  <circle cx="50" cy="50" r="50" fill="url(#gradientDustyRose)" />
  
  <!-- A small, minimal, solid white heart icon, centered -->
  <path d="M50 70 C50 70 35 55 35 45 C35 38 40 33 45 33 C48 33 50 35 50 38 C50 35 52 33 55 33 C60 33 65 38 65 45 C65 55 50 70 50 70 Z" fill="#ffffff" />
</svg>
